

<!DOCTYPE html>
<html>
<head>
    <title>Payments Management</title>

    <style>
        body {
            font-family: Arial;
            background: #fff0f5;
            text-align: center;
            margin: 0;
        }

        header {
            background: #800040;
            color: white;
            padding: 20px;
        }

        nav {
            background: #4d0026;
            padding: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 10px;
        }

        input {
            padding: 10px;
            margin: 8px;
        }

        button {
            background: #800040;
            color: white;
            padding: 10px 15px;
            border: none;
            cursor: pointer;
            margin: 5px;
        }

        table {
            margin: 20px auto;
            border-collapse: collapse;
            background: white;
            width: 80%;
        }

        th, td {
            border: 1px solid #aaa;
            padding: 10px;
        }

        th {
            background: #800040;
            color: white;
        }
    </style>
</head>

<body>

<header>
    <h1>Payments Management</h1>
</header>

<nav>
    <a href="index4.html">Home</a>
    <a href="customers4.html">Customers</a>
    <a href="halls4.html">Halls</a>
    <a href="bookings4.html">Bookings</a>
    <a href="payments4.html">Payments</a>
    <a href="about4.html">About</a>
</nav>

<h2>Add Payment</h2>

<form id="paymentForm">
    <input type="number" id="booking_id"
        placeholder="Booking ID" required>

    <input type="number" id="amount"
        placeholder="Amount" required>

    <select id="payment_status" required>
        <option value="">Select Payment Status</option>
        <option value="Paid">Paid</option>
        <option value="Pending">Pending</option>
    </select>

    <button type="submit">Add Payment</button>
</form>

<h2>Payment Records</h2>

<table>
    <thead>
        <tr>
            <th>Payment ID</th>
            <th>Booking ID</th>
            <th>Amount</th>
            <th>Payment Status</th>
            <th>Action</th>
        </tr>
    </thead>

    <tbody id="records"></tbody>
</table>

<script>
    const form = document.getElementById("paymentForm");
    const records = document.getElementById("records");

    async function loadPayments() {
        const response = await fetch("/api/payments");
        const data = await response.json();

        records.innerHTML = "";

        data.forEach(p => {
            records.innerHTML += `
                <tr>
                    <td>${p.payment_id}</td>
                    <td>${p.booking_id}</td>
                    <td>${p.amount}</td>
                    <td>${p.payment_status}</td>
                    <td>
                        <button onclick="editPayment(
                            ${p.payment_id},
                            ${p.booking_id},
                            ${p.amount},
                            '${p.payment_status}'
                        )">Edit</button>

                        <button onclick="deletePayment(${p.payment_id})">
                            Delete
                        </button>
                    </td>
                </tr>
            `;
        });
    }

    form.addEventListener("submit", async function(e) {
        e.preventDefault();

        const payment = {
            booking_id: document.getElementById("booking_id").value,
            amount: document.getElementById("amount").value,
            payment_status: document.getElementById("payment_status").value
        };

        await fetch("/api/payments", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify(payment)
        });

        form.reset();
        loadPayments();
    });

    async function deletePayment(id) {
        if (confirm("Delete this payment?")) {
            await fetch("/api/payments/" + id, {
                method: "DELETE"
            });

            loadPayments();
        }
    }

    async function editPayment(id, booking, amount, status) {
        const booking_id = prompt("Enter Booking ID:", booking);
        const newAmount = prompt("Enter Amount:", amount);
        const payment_status = prompt("Enter Status:", status);

        if (booking_id && newAmount && payment_status) {
            await fetch("/api/payments/" + id, {
                method: "PUT",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({
                    booking_id,
                    amount: newAmount,
                    payment_status
                })
            });

            loadPayments();
        }
    }

    loadPayments();
</script>

</body>
</html>
